# 盤中每 20 分鐘掃描「全市場大股票池」→ 符合策略的標的推播到 Telegram / LINE
# 計算在 GitHub 的機器上跑（記憶體 7GB），Streamlit 網站只讀結果，所以不會再爆記憶體。
name: scan

on:
  schedule:
    - cron: "*/20 0-6 * * 1-5"      # UTC 00:00–06:59 = 台北 08:00–14:59，週一到週五
  workflow_dispatch:                 # 也可以在 Actions 頁面手動執行

concurrency:
  group: tq-state                    # 掃描與週報共用，避免同時寫 state 分支
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt

      - run: pip install -r requirements-scan.txt

      - name: 取出 state 分支（不存在就建立空資料夾）
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git clone --depth 1 --branch state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
            rm -rf state/.git
          else
            mkdir state
          fi

      - name: 還原主力資料快取（檔案很大，不放進 git）
        id: day
        run: echo "d=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            state/inst_history.csv
            state/inst_refresh.txt
          key: inst-${{ steps.day.outputs.d }}
          restore-keys: inst-

      - name: 掃描並推播
        env:
          STATE_DIR: state
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_BROADCAST: ${{ vars.LINE_BROADCAST }}       # 設 1 = 公開訊號廣播給所有好友
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}     # 你的持股（只存在 Secrets，不進 repo）
          WATCHLIST: ${{ vars.WATCHLIST }}                  # 例：2330,2454,3037
          N_UNIVERSE: ${{ vars.N_UNIVERSE || '1200' }}
          CAPITAL: ${{ vars.CAPITAL || '1000000' }}
          RISK_PCT: ${{ vars.RISK_PCT || '1.5' }}
        run: python tw_quant_app.py --scan-once

      - name: 存回 state 分支（永遠只保留 1 個 commit，repo 不會變肥）
        run: |
          cd state
          printf 'inst_history.csv\ninst_refresh.txt\n' > .gitignore
          git init -q -b state
          git config user.name "tq-bot"
          git config user.email "tq-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
